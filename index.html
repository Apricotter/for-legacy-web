        <!--CSS for noscript screen-->
        <style>
            noscript {
                background: #242424;
                color: white;
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                user-select: none;
            }
            noscript > div {
                padding: 12px;
                display: flex;
                font-family: "Open Sans", sans-serif;
                flex-direction: column;
                justify-content: center;
                text-align: center;
            }
            noscript > div > h1 {
                margin: 8px 0;
                text-transform: uppercase;
                font-size: 20px;
                font-weight: 700;
            }
            noscript > div > p {
                margin: 4px 0;
                font-size: 14px;
            }
            noscript > div > a {
                align-self: center;
                margin-top: 20px;
                padding: 8px 10px;
                font-size: 14px;
                width: 80px;
                font-weight: 600;
                background: #ed5151;
                border-radius: 4px;
                text-decoration: none;
                color: white;
                transition: background-color 0.2s;
            }
            noscript > div > a:hover {
                background-color: #cf4848;
            }
            noscript > div > a:active {
                background-color: #b64141;
            }
        </style>
